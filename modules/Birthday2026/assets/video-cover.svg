<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="twilightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#120515"/>
      <stop offset="35%" stop-color="#310d2b"/>
      <stop offset="65%" stop-color="#64163f"/>
      <stop offset="85%" stop-color="#9d2b56"/>
      <stop offset="100%" stop-color="#e05777"/>
    </linearGradient>
    <radialGradient id="sunGlowWide" cx="62%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#ff9ebb" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#e0407a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e0407a" stop-opacity="0"/>
    </radialGradient>
    <filter id="cinematicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#twilightSky)"/>
  <circle cx="790" cy="540" r="300" fill="url(#sunGlowWide)" filter="url(#cinematicGlow)"/>

  <!-- Soft Sunset Clouds -->
  <path d="M100 480 Q300 420 520 470 T980 440 T1280 460 L1280 720 L0 720 Z" fill="#4d1031" opacity="0.45"/>
  <path d="M0 540 Q250 490 550 530 T1050 510 T1280 530 L1280 720 L0 720 Z" fill="#2d081e" opacity="0.6"/>

  <!-- Horizon Silhouette of Couple sitting together on bench or hillside -->
  <path d="M0 640 Q350 600 700 620 T1280 630 L1280 720 L0 720 Z" fill="#0d0208"/>

  <g transform="translate(680, 420)">
    <!-- Couple sitting close against sunset -->
    <!-- Person 1 -->
    <circle cx="90" cy="90" r="28" fill="#0d0208"/>
    <path d="M50 120 Q90 115 130 120 L140 220 L40 220 Z" fill="#0d0208"/>

    <!-- Person 2 resting head on shoulder -->
    <circle cx="135" cy="100" r="26" fill="#0d0208"/>
    <path d="M120 125 Q150 120 180 130 L190 220 L110 220 Z" fill="#0d0208"/>
  </g>

  <!-- Ambient glowing hearts floating up in sunset -->
  <path d="M800 360 C800 345 785 335 775 345 C765 355 775 375 800 395 C825 375 835 355 825 345 C815 335 800 345 800 360 Z" fill="#ff79b0" opacity="0.7"/>
  <path d="M500 280 C500 270 490 260 480 270 C470 280 480 295 500 310 C520 295 530 280 520 270 C510 260 500 270 500 280 Z" fill="#ff9ebb" opacity="0.6"/>
  <path d="M1020 300 C1020 290 1010 280 1000 290 C990 300 1000 315 1020 330 C1040 315 1050 300 1040 290 C1030 280 1020 290 1020 300 Z" fill="#ff9ebb" opacity="0.6"/>

  <!-- Subtle romantic typography watermark overlay -->
  <text x="640" y="240" font-family="'Playfair Display', serif" font-size="34" fill="#ffe5ee" text-anchor="middle" font-weight="600" letter-spacing="4" opacity="0.85">A LOVE STORY IN MOTION</text>
  <text x="640" y="280" font-family="'Dancing Script', cursive" font-size="28" fill="#ff79b0" text-anchor="middle" opacity="0.9">Our Most Beautiful Journey</text>
</svg>
