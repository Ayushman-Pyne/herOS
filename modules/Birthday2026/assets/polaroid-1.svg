<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0914"/>
      <stop offset="50%" stop-color="#4a152d"/>
      <stop offset="100%" stop-color="#2a0c1b"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff4b8b" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#931b4e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1f0914" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgGrad1)"/>
  <circle cx="300" cy="240" r="180" fill="url(#glow1)"/>

  <!-- Bokeh particles -->
  <circle cx="120" cy="150" r="8" fill="#ff7eb3" opacity="0.4" filter="url(#softBlur)"/>
  <circle cx="480" cy="180" r="14" fill="#ff4b8b" opacity="0.35" filter="url(#softBlur)"/>
  <circle cx="220" cy="80" r="6" fill="#ffb8d2" opacity="0.5"/>
  <circle cx="400" cy="110" r="10" fill="#ff7eb3" opacity="0.3"/>

  <!-- Couple Silhouette & Artistic Portrait -->
  <g transform="translate(100, 100)">
    <!-- Person 1 (Man on left) -->
    <path d="M120 180 Q100 130 140 100 Q180 80 200 120 Q220 160 200 200 Z" fill="#2a101f"/>
    <circle cx="165" cy="135" r="45" fill="#3d182c"/>
    <!-- Gentle smile highlight -->
    <path d="M150 145 Q165 160 180 145" stroke="#f472b6" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M70 380 Q100 240 170 210 Q240 240 270 380 Z" fill="#1c0b16"/>

    <!-- Person 2 (Woman on right resting head tenderly) -->
    <path d="M220 190 Q200 140 235 115 Q270 95 295 130 Q315 170 285 220 Z" fill="#2e1022"/>
    <circle cx="260" cy="150" r="42" fill="#421a30"/>
    <!-- Hair flowing -->
    <path d="M230 130 Q270 90 305 140 Q325 210 320 280 Q290 260 270 220 Z" fill="#220a17"/>
    <!-- Gentle smile -->
    <path d="M248 160 Q260 172 272 160" stroke="#f472b6" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M190 380 Q240 250 310 240 Q370 270 380 380 Z" fill="#2a0d1e"/>
  </g>

  <!-- Tender Heart Accents -->
  <path d="M300 260 C300 240 280 225 265 240 C250 255 265 280 300 305 C335 280 350 255 335 240 C320 225 300 240 300 260 Z" fill="#ff4b8b" opacity="0.85"/>
  <text x="300" y="520" font-family="'Playfair Display', serif" font-size="28" fill="#ffd1e3" text-anchor="middle" font-weight="600" letter-spacing="2">OUR SMILE</text>
  <text x="300" y="555" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#f472b6" text-anchor="middle" letter-spacing="1">Memories That Light Up My World</text>
</svg>
