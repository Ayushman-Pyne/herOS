<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday, Debannita - Cake Celebration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body class="bg-[#0b0207] text-pink-100 min-h-screen flex flex-col justify-center items-center p-6 font-sans-clean overflow-x-hidden relative selection:bg-pink-500/30">
    <canvas id="hearts-canvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <div class="relative z-10 w-full max-w-2xl flex flex-col items-center my-auto text-center">
      <div class="mb-4">
        <h1 class="font-serif-luxury text-3xl sm:text-4xl font-normal text-pink-100 tracking-wider uppercase">
          Happy Birthday,
        </h1>
        <span class="font-cursive text-6xl text-pink-400 drop-shadow-[0_0_20px_rgba(255,59,125,0.85)] leading-tight">
          Debannita
        </span>
      </div>

      <div class="relative w-72 h-72 select-none my-2">
        <img src="../assets/birthday-cake.svg" alt="Birthday Cake" class="w-full h-full object-contain filter drop-shadow-[0_0_25px_rgba(255,59,125,0.4)]">
        <div id="cake-flame" class="absolute top-[16%] left-1/2 -translate-x-1/2 -translate-y-1/2 w-16 h-16 flex items-center justify-center cursor-pointer">
          <div class="w-6 h-8 rounded-full bg-gradient-to-t from-orange-500 via-amber-300 to-yellow-100 animate-flicker shadow-[0_0_25px_#ff0055,0_0_12px_#ffaa00]"></div>
        </div>
      </div>

      <div class="mt-4 max-w-lg glass-card-romantic p-4 sm:p-6 rounded-2xl border border-pink-500/25 shadow-xl text-pink-100">
        <p class="font-serif-luxury text-sm sm:text-base leading-relaxed italic text-pink-200/95">
          "Thank you for being my happiness, my love and my everything. Forever yours, Ayushman 💖"
        </p>
      </div>

      <div class="mt-8 flex gap-4">
        <a href="../index.html" class="px-6 py-2.5 rounded-full bg-pink-600 hover:bg-pink-500 text-white text-xs font-medium no-underline shadow-lg transition-all">
          ← Full Interactive Celebration
        </a>
      </div>
    </div>

    <script src="../js/background.js"></script>
    <script src="../js/confetti.js"></script>
    <script src="../js/audio.js"></script>
    <script>
      initFloatingHearts();

      document.getElementById('cake-flame').addEventListener('click', () => {
        document.getElementById('cake-flame').style.display = 'none';
        romanticAudio.playBlowSound();
        romanticAudio.playCelebrationChime();
        triggerFireworks();
      });
    </script>
  </body>
</html>
