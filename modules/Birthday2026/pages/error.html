<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>403 Restricted Sanctuary - Access Denied</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body class="bg-[#0b0207] text-pink-100 min-h-screen flex items-center justify-center p-4 font-sans-clean overflow-hidden relative selection:bg-rose-500/30">
    <canvas id="hearts-canvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <main class="relative z-10 w-full max-w-md flex flex-col items-center text-center animate-in fade-in zoom-in-95 duration-500">
      <!-- Glowing Warning Icon -->
      <div class="relative mb-6 animate-float-gentle">
        <div class="absolute -inset-4 rounded-full bg-rose-600/25 blur-2xl animate-pulse"></div>
        <div class="relative w-20 h-20 rounded-full flex items-center justify-center bg-gradient-to-tr from-rose-950/80 via-red-900/50 to-rose-600/30 border border-rose-500/40 shadow-[0_0_40px_rgba(244,63,94,0.45)]">
          <svg class="w-10 h-10 text-rose-300 drop-shadow-[0_0_12px_rgba(244,63,94,0.8)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
            <path d="m12 13-1-1 2-2-3-3 2-2"/>
          </svg>
        </div>
      </div>

      <!-- Modern Status Kicker -->
      <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-rose-950/60 border border-rose-500/30 text-[11px] font-mono text-rose-300 tracking-widest uppercase mb-4 shadow-[0_0_15px_rgba(244,63,94,0.2)]">
        <svg class="w-3.5 h-3.5 text-rose-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M12 8v4M12 16h.01"/>
        </svg>
        <span>Restricted Sanctuary · 403</span>
      </div>

      <!-- Main Headline -->
      <h1 class="font-serif-luxury text-2xl sm:text-4xl font-normal text-rose-100 tracking-wide mb-3 drop-shadow-[0_2px_15px_rgba(244,63,94,0.4)]">
        This page was not made for you.
      </h1>

      <!-- Card Body -->
      <div class="w-full glass-card-error rounded-3xl p-6 sm:p-8 backdrop-blur-2xl mt-2 mb-6 text-left">
        <div class="space-y-3 font-sans-clean text-xs sm:text-sm text-rose-200/80 leading-relaxed">
          <p>This sanctuary is a private celebration created exclusively for someone very special.</p>
          <p class="text-rose-300/60 text-xs">If you are the intended recipient, please return to the gate and verify your Instagram ID and birthday.</p>
        </div>

        <div class="mt-5 pt-4 border-t border-rose-500/20 flex items-center justify-between text-xs text-rose-300/70 font-mono text-[11px]">
          <span class="flex items-center gap-1.5">
            <svg class="w-3 h-3 text-rose-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <span>ACCESS_DENIED</span>
          </span>
          <span class="text-rose-400/80 font-sans-clean">Private Vault</span>
        </div>
      </div>

      <!-- Return Button -->
      <a href="../index.html" class="group relative px-7 py-3 rounded-2xl bg-gradient-to-r from-rose-700 via-pink-600 to-rose-700 hover:from-rose-600 hover:to-pink-500 text-white font-medium text-xs sm:text-sm tracking-wide shadow-[0_0_25px_rgba(244,63,94,0.45)] hover:shadow-[0_0_35px_rgba(244,63,94,0.65)] transition-all duration-300 cursor-pointer overflow-hidden flex items-center gap-2 no-underline">
        <svg class="w-4 h-4 group-hover:-translate-x-1 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m12 19-7-7 7-7M19 12H5"/>
        </svg>
        <span>Return to Gate</span>
      </a>
    </main>

    <script src="../js/background.js"></script>
    <script>
      initFloatingHearts();
    </script>
  </body>
</html>
