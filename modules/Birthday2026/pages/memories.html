<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Precious Memories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body class="bg-[#0b0207] text-pink-100 min-h-screen flex flex-col justify-between items-center p-6 font-sans-clean overflow-x-hidden relative selection:bg-pink-500/30">
    <canvas id="hearts-canvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <div class="relative z-10 w-full max-w-6xl flex flex-col items-center my-auto">
      <div class="text-center mb-10">
        <h1 class="font-serif-luxury text-3xl sm:text-4xl text-pink-100 font-normal tracking-wide drop-shadow-[0_2px_15px_rgba(255,100,160,0.5)]">
          💕 Our Precious Memories 💕
        </h1>
        <p class="font-sans-clean text-xs sm:text-sm text-pink-300/80 mt-1">Moments that mean everything</p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 w-full max-w-5xl justify-items-center mb-10">
        <div class="polaroid-card w-56 sm:w-60 bg-stone-100 p-3.5 pb-7 rounded-sm shadow-2xl border border-stone-200" style="transform: rotate(-3deg);">
          <div class="aspect-[4/5] w-full bg-stone-900 overflow-hidden rounded-xs"><img src="../assets_guide/polaroid-1.jpg" class="w-full h-full object-cover"></div>
          <div class="pt-3 text-center"><p class="font-script text-xl text-stone-800 font-semibold">Our Smile</p></div>
        </div>
        <div class="polaroid-card w-56 sm:w-60 bg-stone-100 p-3.5 pb-7 rounded-sm shadow-2xl border border-stone-200" style="transform: rotate(2deg);">
          <div class="aspect-[4/5] w-full bg-stone-900 overflow-hidden rounded-xs"><img src="../assets/polaroid-2.svg" class="w-full h-full object-cover"></div>
          <div class="pt-3 text-center"><p class="font-script text-xl text-stone-800 font-semibold">Our Favorite Moment</p></div>
        </div>
        <div class="polaroid-card w-56 sm:w-60 bg-stone-100 p-3.5 pb-7 rounded-sm shadow-2xl border border-stone-200" style="transform: rotate(-2deg);">
          <div class="aspect-[4/5] w-full bg-stone-900 overflow-hidden rounded-xs"><img src="../assets/polaroid-3.svg" class="w-full h-full object-cover"></div>
          <div class="pt-3 text-center"><p class="font-script text-xl text-stone-800 font-semibold">Together Forever</p></div>
        </div>
        <div class="polaroid-card w-56 sm:w-60 bg-stone-100 p-3.5 pb-7 rounded-sm shadow-2xl border border-stone-200" style="transform: rotate(3deg);">
          <div class="aspect-[4/5] w-full bg-stone-900 overflow-hidden rounded-xs"><img src="../assets/polaroid-4.svg" class="w-full h-full object-cover"></div>
          <div class="pt-3 text-center"><p class="font-script text-xl text-stone-800 font-semibold">My Happy Place</p></div>
        </div>
      </div>

      <a href="../index.html" class="px-6 py-2.5 rounded-full bg-pink-600 hover:bg-pink-500 text-white text-xs font-medium no-underline shadow-lg transition-all">
        ← Return to Main Celebration
      </a>
    </div>

    <script src="../js/background.js"></script>
    <script>
      initFloatingHearts();
    </script>
  </body>
</html>
