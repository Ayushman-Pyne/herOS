<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Access Our World - Secret Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body class="bg-[#0b0207] text-pink-100 min-h-screen flex items-center justify-center p-4 font-sans-clean overflow-hidden relative selection:bg-pink-500/30">
    <canvas id="hearts-canvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <main class="relative z-10 w-full max-w-md flex flex-col items-center">
      <div class="relative mb-6">
        <div class="absolute -inset-4 rounded-full bg-pink-500/20 blur-xl animate-pulse"></div>
        <div class="relative w-20 h-20 rounded-full flex items-center justify-center bg-gradient-to-tr from-pink-900/60 via-pink-600/40 to-pink-500/30 border border-pink-400/50 shadow-[0_0_35px_rgba(255,59,125,0.45)]">
          <svg class="w-10 h-10 text-pink-300 fill-pink-500/30" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
          </svg>
        </div>
      </div>

      <h1 class="font-serif-luxury text-3xl sm:text-4xl font-normal text-pink-100 text-center tracking-wide mb-1 drop-shadow-[0_2px_15px_rgba(255,100,160,0.4)]">
        Access Our World
      </h1>
      <p class="font-sans-clean text-xs sm:text-sm text-pink-300/80 text-center mb-8 tracking-wide">
        A special place, just for you <span class="text-pink-400 inline-block animate-pulse">💕</span>
      </p>

      <div class="w-full glass-card-romantic rounded-3xl p-6 sm:p-8 neon-box-glow border border-pink-500/30 backdrop-blur-2xl">
        <form id="vault-form" class="space-y-4">
          <div class="space-y-1.5">
            <div class="relative flex items-center">
              <span class="absolute left-3.5 text-pink-400/80">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
              <input type="text" id="username" placeholder="Instagram ID" required class="w-full pl-10 pr-4 py-3 bg-black/40 border border-pink-500/25 focus:border-pink-400/70 rounded-xl text-sm text-pink-100 placeholder-pink-400/40 focus:outline-none transition-all">
            </div>
          </div>

          <div class="space-y-1.5">
            <div class="relative flex items-center">
              <span class="absolute left-3.5 text-pink-400/80">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input type="password" id="password" placeholder="My Birthday DDMM" required class="w-full pl-10 pr-11 py-3 bg-black/40 border border-pink-500/25 focus:border-pink-400/70 rounded-xl text-sm text-pink-100 placeholder-pink-400/40 focus:outline-none transition-all tracking-wider">
            </div>
          </div>

          <div class="pt-2">
            <button type="submit" class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-pink-600 via-rose-500 to-pink-600 hover:from-pink-500 hover:to-rose-400 text-white font-medium text-sm tracking-wide shadow-[0_0_25px_rgba(236,72,153,0.45)] transition-all cursor-pointer flex items-center justify-center gap-2">
              <span>Unlock Surprise</span>
              <svg class="w-4 h-4 fill-white" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
            </button>
          </div>
        </form>
      </div>

      <footer class="mt-6 flex items-center gap-2 text-xs font-sans-clean text-pink-300/70 tracking-wide">
        <span class="text-pink-400">💕</span>
        <span>Made with Love by Ayushman</span>
        <span class="text-pink-400">💕</span>
      </footer>
    </main>

    <script src="../js/background.js"></script>
    <script src="../js/auth.js"></script>
    <script>
      initFloatingHearts();

      document.getElementById('vault-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        if (validateLogin(user, pass)) {
          window.location.href = '../index.html';
        } else {
          window.location.href = './error.html';
        }
      });
    </script>
  </body>
</html>
